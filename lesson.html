<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson — Matrix Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&family=Delius&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app"></div>

<script src="js/course.js"></script>
<script src="js/audio.js"></script>
<script>
  /* Load the lesson file for ?m=<module>&p=<page> as a classic script so the
     whole thing works from file:// with zero build steps. */
  (function () {
    var q = new URLSearchParams(location.search);
    var m = q.get("m") || "0";
    var p = q.get("p") || "1";
    window.__lessonId = "m" + m + "-p" + p;
    document.write('<script src="js/lessons/' + window.__lessonId + '.js"><\/script>');
  })();
</script>
<script src="js/engine.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    var def = window.LESSONS && window.LESSONS[window.__lessonId];
    if (def) {
      document.title = def.title + " — Matrix Mastery";
      LessonEngine.mount(def, { module: def.module, page: def.page });
    } else {
      document.getElementById("app").innerHTML =
        '<main class="lesson-main"><div class="card"><h2>Lesson not found</h2>' +
        '<p>The lesson <code>' + window.__lessonId + '</code> does not exist yet. ' +
        '<a href="index.html">Back to the course home</a>.</p></div></main>';
    }
  });
</script>
</body>
</html>
